services:
  statsfolio:
    build: .
    # image: ghcr.io/mhwasil/statsfolio:latest  # Uncomment after pushing updated image
    container_name: statsfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Or use inline environment variables instead of env_file:
    # environment:
    #   - GHOSTFOLIO_HOST=https://your-ghostfolio-instance.com
    #   - GHOSTFOLIO_TOKEN=your-access-token
    #   - BASE_URL=/statsfolio
    #   - HOST=0.0.0.0
    #   - PORT=3000
